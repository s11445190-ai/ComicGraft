<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComicGraft</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>ComicGraft</h1>
    <p>Interactive Comic & Panel Layout Studio</p>
  </header>

  <main>
    <section id="toolbar">
      <button id="add-panel-btn">Add Panel</button>
      <button id="add-text-btn">Add Speech Bubble</button>
      <button id="export-btn">Export Page</button>
    </section>

    <section id="workspace">
      <div id="comic-canvas">
        <!-- Comic panels and speech bubbles will be generated here -->
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
